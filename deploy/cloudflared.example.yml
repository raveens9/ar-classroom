# Cloudflare Tunnel config for local backend → public HTTPS.
# Copy this to ~/.cloudflared/config.yml and fill in your values.
#
# Setup (one-time):
#   brew install cloudflare/cloudflare/cloudflared
#   cloudflared tunnel login             # opens browser, links your CF account
#   cloudflared tunnel create ar-backend # creates tunnel, saves credentials JSON
#   cloudflared tunnel route dns ar-backend realtime.yourdomain.com
#   cloudflared tunnel route dns ar-backend ml.yourdomain.com
#
# Run (every session before class):
#   npm run build:backend   # compile realtime TypeScript
#   npm run start:backend   # start realtime + ml-api locally
#   cloudflared tunnel run ar-backend

tunnel: <paste-tunnel-id-here>
credentials-file: /Users/<your-username>/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: realtime.yourdomain.com
    service: http://localhost:4001
  - hostname: ml.yourdomain.com
    service: http://localhost:8000
  - service: http_status:404
